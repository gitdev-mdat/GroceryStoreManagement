[project]
name = "crew"
version = "0.1.0"
description = "Autonomous software-engineering workflow for the HaiKieu repository"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.22"
]

[project.scripts]
kickoff = "crew.main:kickoff"
run_crew = "crew.main:kickoff"
plot = "crew.main:plot"
run_with_trigger = "crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "ab163bea-0d81-4017-8bb0-8c20c351b43c"
